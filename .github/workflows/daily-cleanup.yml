# Runs every day at 3am Singapore time: deletes photos older than
# 3 months and keeps the free Supabase project awake.
name: Daily cleanup

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old photos and keep Supabase awake
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/api" \
            -H "Content-Type: application/json" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"action":"cleanup"}'

      - name: Monthly heartbeat
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
            cd repo
            date -u +"%Y-%m-%d" > .github/heartbeat.txt
            git config user.name "cleanup-bot"
            git config user.email "cleanup-bot@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "Monthly heartbeat" && git push
          fi
